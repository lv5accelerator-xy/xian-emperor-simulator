name: Release check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          find src -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Validate embedded audio
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const code = fs.readFileSync('src/audio-data.js', 'utf8');
          const context = { window: {} };
          vm.runInNewContext(code, context);
          const audio = context.window.XIAN_AUDIO_DATA;
          const required = ['button', 'scroll', 'seal', 'report', 'monthEnd', 'warning', 'bgm'];
          for (const key of required) {
            if (typeof audio?.[key] !== 'string' || !audio[key].startsWith('data:audio/ogg;base64,')) {
              throw new Error(`Invalid audio source: ${key}`);
            }
            const bytes = Buffer.from(audio[key].split(',')[1], 'base64');
            if (bytes.length < 500 || bytes.subarray(0, 4).toString('ascii') !== 'OggS') {
              throw new Error(`Invalid OGG payload: ${key}`);
            }
          }
          console.log('Embedded audio payloads are valid.');
          NODE

      - name: Validate scene music and archived alternates
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync('src/audio-tracks.js', 'utf8'), context);
          const tracks = context.window.XIAN_MUSIC_TRACKS;
          const expected = ['menu', 'court', 'crisis', 'battle', 'ending'];
          if (JSON.stringify(Object.keys(tracks || {})) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected scene music manifest: ${JSON.stringify(Object.keys(tracks || {}))}`);
          }
          for (const [scene, file] of Object.entries(tracks)) {
            if (file.includes('/alternates/')) throw new Error(`Backup track used at runtime: ${scene}`);
            const bytes = fs.readFileSync(file);
            if (bytes.length < 500000 || bytes.subarray(0, 3).toString('ascii') !== 'ID3') {
              throw new Error(`Invalid scene MP3: ${scene}`);
            }
          }
          const alternates = fs.readdirSync('assets/audio/bgm/alternates').filter(file => file.endsWith('.mp3'));
          if (alternates.length !== 3) throw new Error(`Expected 3 archived alternates, found ${alternates.length}`);
          console.log('Scene music and archived alternates are valid.');
          NODE

      - name: Guard against observer and preload regressions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const audio = fs.readFileSync('src/audio.js', 'utf8');
          const army = fs.readFileSync('src/army-system.js', 'utf8');
          if (/observe\(document\.(body|documentElement)/.test(audio)) {
            throw new Error('Audio must not observe the entire document tree.');
          }
          if (/preload\s*=\s*["']auto["']/.test(audio)) {
            throw new Error('Audio effects must remain lazy-loaded.');
          }
          if (!audio.includes('observeStableTargets') || !audio.includes('preload = "none"')) {
            throw new Error('Stable lazy audio setup is missing.');
          }
          if (/MutationObserver/.test(army)) {
            throw new Error('Army system must use save events, not DOM mutation observers.');
          }
          if (!army.includes('window.__xianArmyRefreshOnly')) {
            throw new Error('Army storage recursion guard is missing.');
          }
          console.log('Runtime regression guards passed.');
          NODE

      - name: Validate targeted edict matching
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          class StorageMock {
            constructor() { this.values = new Map(); }
            getItem(key) { return this.values.has(key) ? this.values.get(key) : null; }
            setItem(key, value) { this.values.set(key, String(value)); }
            removeItem(key) { this.values.delete(key); }
          }

          const localStorage = new StorageMock();
          const document = {
            readyState: 'loading',
            addEventListener() {},
            getElementById() { return null; },
            dispatchEvent() {},
          };
          const windowObject = { setTimeout, clearTimeout };
          const context = {
            window: windowObject,
            document,
            Storage: StorageMock,
            localStorage,
            console,
            CustomEvent: class CustomEvent {},
            setTimeout,
            clearTimeout,
          };

          vm.runInNewContext(fs.readFileSync('src/world-data.js', 'utf8'), context);
          vm.runInNewContext(fs.readFileSync('src/decree-world.js', 'utf8'), context);

          const jing = context.window.XianDecreeWorld.detectTargets('命荆州牧刘表在襄阳减赋半年并开仓赈济');
          if (!jing.regions.includes('jingzhou') || !jing.lords.includes('liu_biao')) {
            throw new Error(`Failed Jingzhou/Liu Biao matching: ${JSON.stringify(jing)}`);
          }

          const north = context.window.XianDecreeWorld.detectTargets('命袁绍整军冀州并守邺城');
          if (!north.regions.includes('jizhou') || !north.lords.includes('yuan_shao')) {
            throw new Error(`Failed Jizhou/Yuan Shao matching: ${JSON.stringify(north)}`);
          }

          const south = context.window.XianDecreeWorld.detectTargets('遣使江东吴郡，授孙策官爵');
          if (!south.regions.includes('jiangdong') || !south.lords.includes('sun_ce')) {
            throw new Error(`Failed Jiangdong/Sun Ce matching: ${JSON.stringify(south)}`);
          }

          console.log('Targeted edict matching passed.');
          NODE

      - name: Validate ordered routes confirmation and armies
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          class StorageMock {
            constructor() { this.values = new Map(); }
            getItem(key) { return this.values.has(key) ? this.values.get(key) : null; }
            setItem(key, value) { this.values.set(key, String(value)); }
            removeItem(key) { this.values.delete(key); }
          }

          const localStorage = new StorageMock();
          localStorage.setItem('xian_emperor_simulator_v01', JSON.stringify({
            turn: 1,
            year: 196,
            month: 10,
            createdAt: 'test-game',
            stats: { authority: 50, officials: 50, caoAlert: 40, prestige: 70 },
            hidden: { leakRisk: 10 },
            reports: [],
          }));

          const document = {
            readyState: 'loading',
            addEventListener() {},
            getElementById() { return null; },
            querySelector() { return null; },
            querySelectorAll() { return []; },
            dispatchEvent() {},
            body: { classList: { add() {}, remove() {} }, appendChild() {} },
          };
          const windowObject = { setTimeout, clearTimeout };
          const context = {
            window: windowObject,
            document,
            Storage: StorageMock,
            localStorage,
            console,
            CustomEvent: class CustomEvent {},
            setTimeout,
            clearTimeout,
          };

          for (const file of [
            'src/strategy-network-data.js',
            'src/strategy-network.js',
            'src/decree-confirmation.js',
            'src/army-data.js',
            'src/army-system.js',
          ]) {
            vm.runInNewContext(fs.readFileSync(file, 'utf8'), context, { filename: file });
          }

          const edict = '命荆州牧刘表自襄阳出兵，经宛城驰援许都；三月内奉表并输粮三千石。';
          const strategy = context.window.XianStrategyNetwork;
          const cities = strategy.detectCityTargets(edict);
          if (JSON.stringify(cities) !== JSON.stringify(['xiangyang', 'wan', 'xudu'])) {
            throw new Error(`City order was not preserved: ${JSON.stringify(cities)}`);
          }
          const path = strategy.resolveOrderedPath(cities, ['liu_biao']);
          if (JSON.stringify(path) !== JSON.stringify(['wan_xiangyang', 'xudu_wan'])) {
            throw new Error(`Unexpected ordered path: ${JSON.stringify(path)}`);
          }

          const preview = context.window.XianDecreeConfirmation.analyzeEdict(edict);
          if (preview.routeIds.length !== 2 || !preview.promises.includes('tribute')) {
            throw new Error(`Invalid decree preview: ${JSON.stringify(preview)}`);
          }

          if (context.window.XIAN_ARMY_DATA.armies.length !== 14) {
            throw new Error('Expected 14 initial armies.');
          }
          const armyApi = context.window.XianArmySystem;
          if (armyApi.choosePrimaryOrder(['supply', 'support']) !== 'support') {
            throw new Error('Army order priority is incorrect.');
          }
          const commander = { command: 80 };
          const healthy = armyApi.calculateCombatPower({ troops: 10000, training: 75, morale: 75, supply: 80, fatigue: 10 }, commander, 60, true, 1);
          const starved = armyApi.calculateCombatPower({ troops: 10000, training: 75, morale: 40, supply: 10, fatigue: 80 }, commander, 0, false, 1);
          if (!(healthy > starved * 1.8)) {
            throw new Error(`Supply, morale and fatigue do not affect combat enough: ${healthy} vs ${starved}`);
          }

          console.log('Ordered route, confirmation and army calculations passed.');
          NODE

