name: Release check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check src/audio.js
          node --check src/audio-data.js
          node --check src/world-hotfix.js
          node --check src/world-system.js

      - name: Validate embedded audio
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const code = fs.readFileSync('src/audio-data.js', 'utf8');
          const context = { window: {} };
          vm.runInNewContext(code, context);
          const audio = context.window.XIAN_AUDIO_DATA;
          const required = ['button', 'scroll', 'seal', 'report', 'monthEnd', 'warning', 'bgm'];
          for (const key of required) {
            if (typeof audio?.[key] !== 'string' || !audio[key].startsWith('data:audio/ogg;base64,')) {
              throw new Error(`Invalid audio source: ${key}`);
            }
            const bytes = Buffer.from(audio[key].split(',')[1], 'base64');
            if (bytes.length < 500 || bytes.subarray(0, 4).toString('ascii') !== 'OggS') {
              throw new Error(`Invalid OGG payload: ${key}`);
            }
          }
          console.log('Embedded audio payloads are valid.');
          NODE

      - name: Guard against observer and preload regressions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const code = fs.readFileSync('src/audio.js', 'utf8');
          if (/observe\(document\.(body|documentElement)/.test(code)) {
            throw new Error('Audio must not observe the entire document tree.');
          }
          if (/preload\s*=\s*["']auto["']/.test(code)) {
            throw new Error('Audio effects must remain lazy-loaded.');
          }
          if (!code.includes('observeStableTargets')) {
            throw new Error('Targeted observer setup is missing.');
          }
          if (!code.includes('preload = "none"')) {
            throw new Error('Lazy audio preload setting is missing.');
          }
          console.log('Audio runtime regression guards passed.');
          NODE

      - name: Validate page references and version
        run: |
          grep -q 'v0.2.3.3' index.html
          grep -q 'src/audio.css' index.html
          grep -q 'src/audio-data.js' index.html
          grep -q 'src/audio.js' index.html
          grep -q 'src/world-hotfix.js' index.html
          test -f src/audio.css
          test -f src/audio-data.js
          test -f src/audio.js
          test -f src/world-hotfix.js
